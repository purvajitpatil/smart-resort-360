<script>
  tailwind.config = {
    darkMode: "class",

          "surface-container-high": "#2a292d",

          "surface-bg": "#0B0A21",
          "surface-dim": "#131316",
          "surface-tint": "#c4c1fb",
          "on-secondary": "#1d00a5",
          "on-primary-container": "#8683ba",
          "on-primary": "#2d2a5b",
          "tertiary": "#f1bc91",
          "on-primary-fixed": "#181445",
          "inverse-on-surface": "#313034",
          "on-surface-variant": "#c8c5d0",
          "on-secondary-container": "#b3b1ff",
          "on-error": "#690005",
          "on-tertiary": "#492909",
          "surface-container": "#201f23",
          "surface": "#131316",
          "surface-container-highest": "#353438",
          "outline": "#928f9a",
          "surface-variant": "#353438",
          "on-primary-fixed-variant": "#444173",
          "inverse-primary": "#5b598c",
          "primary-fixed": "#e3dfff",
          "on-secondary-fixed": "#0f0069",
          "on-surface": "#e5e1e6",
          "on-error-container": "#ffdad6",
          "surface-card": "#16143A",
          "danger": "#DC2626",
          "success": "#16A34A",
          "surface-container-low": "#1c1b1f",
          "on-background": "#e5e1e6",
          "secondary-container": "#3626ce",
          "surface-container-lowest": "#0e0e11",
          "surface-bright": "#3a393c",
          "secondary": "#c3c0ff",
          "info": "#0EA5E9",
          "warning": "#F59E0B",
          "primary-fixed-dim": "#c4c1fb",
          "primary": "#c4c1fb",
          "on-primary": "#181445",
          "brand-indigo": "#4F46E5",
          "brand-indigo-deep": "#1E1B4B",
          "brand-emerald": "#16A34A",
          "whatsapp-header": "#075E54",
          "whatsapp-bg": "#ECE5DD",
          "whatsapp-sent": "#E1FFC7",
          "whatsapp-received": "#FFFFFF",
          "whatsapp-text": "#303030",
          "whatsapp-meta": "#8696A0",
          "whatsapp-blue-tick": "#53BDEB",
          "whatsapp-input-line": "#F0F2F5"
        },
        borderRadius: {
          "DEFAULT": "0.125rem",
          "lg": "0.25rem",
          "xl": "0.5rem",
          "2xl": "1rem",
          "3xl": "1.5rem",
          "full": "0.75rem"
        },
        spacing: {
          "base": "8px",
          "container-margin-desktop": "32px",
          "stack-md": "16px",
          "stack-sm": "8px",
          "container-margin-mobile": "16px",
          "gutter-grid": "24px",
          "stack-lg": "32px"
        },
        fontFamily: {
          "label-caps": ["Geist"],
          "display-lg": ["Sora"],
          "headline-lg": ["Sora"],
          "body-lg": ["Geist"],
          "body-md": ["Geist"],
          "headline-sm": ["Sora"],
          "technical-data": ["Geist"],
          "headline-md": ["Sora"],
          "body-sm": ["Geist"]
        },
        fontSize: {
          "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
          "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
          "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
          "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
          "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
          "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
          "technical-data": ["14px", { "lineHeight": "1", "letterSpacing": "-0.01em", "fontWeight": "500" }],
          "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
          "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
        },
        keyframes: {
          slideUp: {
            "0%": { transform: "translateY(16px)", opacity: "0" },
            "100%": { transform: "translateY(0)", opacity: "1" }
          },
          fadeIn: {
            "0%": { opacity: "0" },
            "100%": { opacity: "1" }
          },
          popIn: {
            "0%": { transform: "scale(0.9)", opacity: "0" },
            "100%": { transform: "scale(1)", opacity: "1" }
          }
        },
        animation: {
          "slide-up": "slideUp 0.45s cubic-bezier(0.16,1,0.3,1) both",
          "fade-in": "fadeIn 0.3s ease both",
          "pop-in": "popIn 0.25s cubic-bezier(0.16,1,0.3,1) both"
        },
        opacity: (function () {
          var o = { 0: '0', 100: '1' };
          for (var i = 1; i <= 99; i++) { o[i] = String(i / 100); }
          return o;
        })()
      }
    }
  };
</script>
